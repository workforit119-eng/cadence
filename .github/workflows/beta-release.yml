name: beta-release

# One-shot bootstrap: tags main as v0.1.0-beta.1 so the `release` workflow
# can publish the beta prerelease. Idempotent — once the tag exists it does
# nothing — and safe to delete any time after the tag has been created.
# Only run this from a commit whose CI is green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create beta tag if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v0.1.0-beta.1
        run: |
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "tag ${TAG} already exists - nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "cadence v0.1.0b1 (beta)"
          git push origin "refs/tags/${TAG}"
          echo "created and pushed tag ${TAG}"
