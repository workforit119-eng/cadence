name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "${{ github.ref_name }}" == *beta* || "${{ github.ref_name }}" == *alpha* || "${{ github.ref_name }}" == *rc* ]]; then
            PRERELEASE="--prerelease"
          fi
          if [[ "${{ github.ref_name }}" == *dev* ]]; then
            PRERELEASE="--draft"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automatically published from tag ${{ github.ref_name }}." \
            $PRERELEASE
      - name: Publish to PyPI (stable tags only)
        if: "!contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')"
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine upload dist/*
