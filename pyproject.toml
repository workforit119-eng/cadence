[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0b1"
description = "A tiny habit tracker CLI that keeps your streaks on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["habits", "streaks", "cli", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.scripts]
cadence = "cadence.cli:main"

[project.urls]
Homepage = "https://github.com/workforit119-eng/cadence"
Issues = "https://github.com/workforit119-eng/cadence/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["cadence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
